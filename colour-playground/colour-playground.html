<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Color Playground</title>

    <link rel="stylesheet" href="color-tools.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/nav.css">
    <link rel="stylesheet" href="/css/txt.css">

</head>

<body>
    <header>
        <div class="nav-small">
            <nav>
                <ul>
                    <li>
                        <svg class="logo" viewBox="0 0 339.26 417.6">
                            <rect x="287.08" width="52.19" height="52.25" />
                            <path
                                d="M287.08,260.99h-78.28v-26.09h-26.09v-52.18h-52.25v52.18h-26.09v26.09h-52.18V104.43H0v182.65h26.09v26.09h52.18v78.34h26.09v26.09h78.34v-26.09h26.09v-26.15h26.09v-52.18h78.28v-26.09h26.09V104.43h-52.19v156.55ZM182.71,365.36h-52.25v-52.18h52.25v52.18Z" />
                            <polygon
                                points="130.46 156.62 182.71 156.62 182.71 130.52 208.8 130.52 208.8 78.34 104.37 78.34 104.37 130.52 130.46 130.52 130.46 156.62" />
                            <rect width="52.18" height="52.25" />
                        </svg>
                    </li>
                    <li><a class="active" href="/index.html">Home</a></li>
                    <li><a href="#">About</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <div class="wrapper">

        <main>
            <section id="color-gen">
                <h1>Color Playground</h1>
                <div class="color-preview"></div>

                <div class="color-values">
                    <h3>Colour value:</h3>
                    <div class="color-value">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="copy"
                            id="copy-hex">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                        </svg>
                        <p><strong>HEX: </strong> <span id="hex-value">#000000</span></p>
                        </p>
                    </div>
                    <div class="color-value">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="copy"
                            id="copy-rgb">
                            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                        </svg>
                        <p><strong>RGB: </strong> <span id="rgb-value">R: 0 G: 0 B: 0</span>
                        </p>
                    </div>
                </div>

                <div class="flex colour-controls">
                    <div class="color-input">
                        <h3>Input your own color:</h3>
                        <input type="color" id="color-picker">
                    </div>

                    <button id="random-color">
                        Random colour
                    </button>

                </div>
            </section>

            <section id="color-converter">
                <h1>Color Converter</h1>
                <div class="converter">
                    <h3>HEX to RGB</h3>

                    <input type="text" placeholder="#00000" id="hex-input">
                </div>
                <div>
                    <h3>RGB to HEX</h3>
                    <div class="rgb-input">
                        <input type="number" placeholder="Red" id="r-input">
                        <input type="number" placeholder="Green" id="g-input">
                        <input type="number" placeholder="Blue" id="b-input">
                    </div>
                </div>
            </section>
        </main>

    </div>
    <script src="script.js"></script>
    <script src="/scripts/main.js"></script>
</body>

</html>
